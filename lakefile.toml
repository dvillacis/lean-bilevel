name = "bileveloptimization"
version = "0.1.0"
defaultTargets = ["BilevelOptimization"]
# Dependents download the compiled library from the GitHub release of the pinned tag.
preferReleaseBuild = true

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "variationalanalysis"
git = "https://github.com/dvillacis/lean-variational"
rev = "v0.1.0"

[[lean_lib]]
name = "BilevelOptimization"
